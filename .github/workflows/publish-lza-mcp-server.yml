name: Publish LZA MCP Server Image

# Builds the awslabs/lza-mcp-server container from upstream source and publishes
# it to GitHub Container Registry (ghcr.io). The upstream project ships source
# only (no published image), so we build it here and embed LZA schemas at build
# time via the documented build args.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Git ref (branch, tag, or SHA) of awslabs/lza-mcp-server to build"
        required: true
        default: "main"
      lza_min_version:
        description: "Earliest LZA version to embed (LZA_MIN_VERSION)"
        required: false
        default: "v1.12.0"
      lza_max_version:
        description: "Latest LZA version to embed (LZA_MAX_VERSION, 'latest' allowed)"
        required: false
        default: "latest"
      lza_uc_release:
        description: "Universal Configuration release to embed (LZA_UC_RELEASE)"
        required: false
        default: "latest"
      image_tag:
        description: "Additional tag to apply to the image (e.g. v1.14.0)"
        required: false
        default: ""
  schedule:
    # Rebuild weekly (Mondays 05:00 UTC) to pick up new upstream LZA schemas.
    - cron: "0 5 * * 1"

env:
  REGISTRY: ghcr.io
  # Published as ghcr.io/<owner>/lza-mcp-server
  IMAGE_NAME: ${{ github.repository_owner }}/lza-mcp-server
  UPSTREAM_REPO: awslabs/lza-mcp-server

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs (with schedule defaults)
        id: vars
        run: |
          echo "upstream_ref=${{ github.event.inputs.upstream_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          echo "lza_min_version=${{ github.event.inputs.lza_min_version || 'v1.12.0' }}" >> "$GITHUB_OUTPUT"
          echo "lza_max_version=${{ github.event.inputs.lza_max_version || 'latest' }}" >> "$GITHUB_OUTPUT"
          echo "lza_uc_release=${{ github.event.inputs.lza_uc_release || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream awslabs/lza-mcp-server
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.vars.outputs.upstream_ref }}
          path: lza-mcp-server

      - name: Locate Dockerfile
        id: context
        run: |
          if [ -f lza-mcp-server/src/lza-mcp-server/Dockerfile ]; then
            echo "dir=lza-mcp-server/src/lza-mcp-server" >> "$GITHUB_OUTPUT"
          elif [ -f lza-mcp-server/Dockerfile ]; then
            echo "dir=lza-mcp-server" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find a Dockerfile in the upstream repository."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event.inputs.image_tag != '' }}
            type=raw,value=lza-${{ steps.vars.outputs.lza_max_version }}
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=lza-mcp-server
            org.opencontainers.image.description=Landing Zone Accelerator on AWS MCP server, built from awslabs/lza-mcp-server
            org.opencontainers.image.source=https://github.com/awslabs/lza-mcp-server
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Alithya (repackaged from awslabs)

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.context.outputs.dir }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LZA_MIN_VERSION=${{ steps.vars.outputs.lza_min_version }}
            LZA_MAX_VERSION=${{ steps.vars.outputs.lza_max_version }}
            LZA_UC_RELEASE=${{ steps.vars.outputs.lza_uc_release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### LZA MCP Server image published"
            echo ""
            echo "- **Upstream ref:** \`${{ steps.vars.outputs.upstream_ref }}\`"
            echo "- **LZA versions:** \`${{ steps.vars.outputs.lza_min_version }}\` → \`${{ steps.vars.outputs.lza_max_version }}\`"
            echo "- **UC release:** \`${{ steps.vars.outputs.lza_uc_release }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
