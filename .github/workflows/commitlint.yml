name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits + DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Full history so the base..head range is available to commitlint.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Lint every commit introduced by this PR against commitlint.config.js
          # (Conventional Commits format + required DCO sign-off). Only PR
          # commits are checked (base..head), not pre-existing history.
          npx commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose
